<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>L'Avent de Jeanne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300;400;500&display=swap">
<style>
/* Concept : papeterie de fête la nuit. Vitrine vert sapin sous la neige, guirlande lumineuse, filets dorés ;
   chaque case se déballe comme un pack puis révèle une carte. Le 24 : une lettre cachetée. */
:root{
  --night:#0b1512;
  --pine:#12241f;
  --pine-hi:#1a332c;
  --pine-deep:#0f201b;
  --line:rgba(201,169,104,.32);
  --gold:#c9a968;
  --gold-hi:#ecd9a6;
  --frost:#a9c8d4;
  --ink:#efe9dc;
  --muted:#8ea198;
  --paper:#f2ece0;
  --paper-ink:#1c2a24;
  --berry:#7d2430;
  --rose:#e2a493;
  --f-display:"Bodoni Moda", "Didot", "Times New Roman", serif;
  --f-body:"Jost", "Futura", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:radial-gradient(110% 60% at 50% -5%, var(--pine-hi) 0%, var(--night) 62%) fixed, var(--night);
  color:var(--ink);font-family:var(--f-body);font-weight:300;font-size:15px;line-height:1.55;
  padding-inline:16px;padding-block:0;overflow-x:hidden;
}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}

/* ---------- Décor de fond ---------- */
#glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(28vmax 28vmax at 8% 78%, rgba(125,36,48,.30), transparent 70%),
    radial-gradient(24vmax 24vmax at 92% 30%, rgba(125,36,48,.22), transparent 70%),
    radial-gradient(30vmax 22vmax at 70% 95%, rgba(201,169,104,.12), transparent 70%),
    radial-gradient(18vmax 18vmax at 20% 18%, rgba(201,169,104,.10), transparent 70%)}
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#deco svg{position:absolute;fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;animation:drift 9s ease-in-out infinite}
@keyframes drift{50%{transform:translateY(-6px) rotate(var(--r2,4deg))}}

/* boules suspendues */
.baubles{position:absolute;top:0;right:0;width:34%;height:260px;z-index:2;pointer-events:none}
.bauble{position:absolute;top:0;transform-origin:top center;animation:swing 5s ease-in-out infinite}
.bauble .thread{width:1px;margin:0 auto;background:linear-gradient(var(--gold),rgba(201,169,104,.4))}
.bauble .cap{width:9px;height:7px;margin:0 auto;border-radius:2px 2px 1px 1px;background:linear-gradient(90deg,#8a6a2c,#ecd9a6,#8a6a2c)}
.bauble .ball{display:block;border:0;padding:0;border-radius:50%;position:relative;box-shadow:0 10px 24px -8px rgba(0,0,0,.7);pointer-events:auto;cursor:pointer}
.bauble .ball.wiggle{animation:wig .7s ease-out}
.bauble .ball[data-egg]{animation:eggglint 7s ease-in-out infinite}
@keyframes wig{0%,100%{transform:none}20%{transform:rotate(-18deg) scale(1.08)}45%{transform:rotate(14deg)}70%{transform:rotate(-7deg)}}
@keyframes eggglint{0%,88%,100%{filter:none}93%{filter:brightness(1.5) drop-shadow(0 0 8px rgba(236,217,166,.8))}}
.bauble .ball::after{content:"";position:absolute;left:22%;top:16%;width:30%;height:22%;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(2px)}
.bauble .ball::before{content:"";position:absolute;left:0;right:0;top:46%;height:8%;background:rgba(236,217,166,.55)}
@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (max-width:640px){.baubles{width:46%;height:90px}.bauble.far{display:none}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto}

/* ---------- Guirlande ---------- */
#garland{position:absolute;left:-16px;right:-16px;top:0;height:70px;z-index:2;pointer-events:none;overflow:visible}
#garland svg{width:100%;height:100%;overflow:visible}
#garland .wire{fill:none;stroke:rgba(201,169,104,.35);stroke-width:1}
#garland .bulb.lit{animation:twinkle 3.2s ease-in-out infinite}
#garland .bulb.fresh{animation:bulbon 1.6s ease-out both}
#garland.full .bulb.lit{animation-duration:1.7s}
@keyframes bulbon{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(2.2)}100%{opacity:1;transform:scale(1)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- En-tête ---------- */
header{padding-block:84px 30px;display:grid;gap:14px}
.eyebrow{font-weight:400;letter-spacing:.32em;text-transform:uppercase;font-size:11px;color:var(--gold)}
h1{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(40px,8.5vw,72px);line-height:.98;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:normal;font-weight:500;color:var(--gold-hi)}
@media (min-width:641px){h1{max-width:64%}}
.status{font-size:15px;color:var(--muted);max-width:52ch}
.status b{color:var(--ink);font-weight:400}

.ticks{display:grid;grid-template-columns:repeat(24,1fr);gap:4px;margin-top:6px;max-width:520px}
.ticks i{height:3px;background:rgba(239,233,220,.1);border-radius:2px;transition:background .4s}
.ticks i.ready{background:transparent;box-shadow:inset 0 0 0 1px var(--gold)}
.ticks i.done{background:var(--gold)}
.ticks i:last-child{background:transparent;box-shadow:inset 0 0 0 1px rgba(236,217,166,.3)}
.ticks i:last-child.ready{box-shadow:inset 0 0 0 1px var(--gold-hi),0 0 6px var(--gold-hi)}
.ticks i:last-child.done{background:var(--gold-hi)}


/* ---------- Écran d'attente ---------- */
#wait{padding-block:96px 20px;display:grid;gap:18px;justify-items:start}
#wait .w-title{max-width:none}
@media (min-width:641px){#wait .w-title{max-width:64%}}
.w-lead{margin:0;max-width:44ch;color:#cfc8b8;font-size:16.5px}
.count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:560px;margin-top:8px}
.count div{border:1px solid var(--line);border-radius:3px;padding:16px 8px 12px;text-align:center;background:linear-gradient(170deg,rgba(26,51,44,.85),rgba(18,36,31,.85));position:relative}
.count div::before{content:"";position:absolute;inset:4px;border:1px solid rgba(201,169,104,.12)}
.count b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(34px,9vw,58px);line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums lining-nums}
.count span{display:block;margin-top:8px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.count b.tick{animation:tick .5s ease-out}
@keyframes tick{0%{opacity:.4;transform:translateY(-4px)}100%{opacity:1;transform:none}}
.w-doors{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;width:100%;max-width:560px;margin-top:6px}
.w-doors i{aspect-ratio:3/4;border:1px solid rgba(201,169,104,.22);border-radius:2px;background:rgba(18,36,31,.6);font-style:normal;font-family:var(--f-display);font-size:11px;color:rgba(239,233,220,.35);display:grid;place-items:center}
.w-doors i:last-child{border-color:rgba(236,217,166,.5);color:var(--gold-hi)}
.w-foot{margin:4px 0 0;font-size:12px;letter-spacing:.06em;color:var(--muted)}

/* ---------- Grille ---------- */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media (max-width:640px){.grid{grid-template-columns:repeat(4,1fr);gap:8px}}

.door{
  position:relative;aspect-ratio:3/4;max-width:100%;border-radius:3px;border:1px solid var(--line);
  background:linear-gradient(170deg,var(--pine-hi),var(--pine) 75%);
  color:var(--ink);font:inherit;cursor:pointer;padding:10px 10px 9px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;
  overflow:hidden;transition:transform .25s ease,border-color .25s,background .25s;
}
.door::before{content:"";position:absolute;inset:4px;border:1px solid rgba(201,169,104,.12);border-radius:1px;pointer-events:none}
.door:focus-visible{outline:1px solid var(--gold-hi);outline-offset:3px}
.door .n{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5.4vw,40px);line-height:1;font-variant-numeric:lining-nums}
.door .s{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;gap:5px;align-items:center;min-width:0;max-width:100%}
.door .s span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.door svg{width:10px;height:10px;flex:none}
/* le 24 se distingue dès la grille */
.door.d24{border-color:rgba(236,217,166,.55)}
.door.d24::before{border-color:rgba(236,217,166,.3)}
.door.d24 .star{position:absolute;top:9px;right:9px;width:14px;height:14px;color:var(--gold-hi);opacity:.7}
.door .candle{position:absolute;top:8px;right:8px;width:15px;height:15px;color:var(--rose);opacity:.85}
.door.fete{border-color:rgba(226,164,147,.45)}
.door.fete.ready{border-color:var(--rose)}
.door.fete.opened{background:linear-gradient(160deg,#3a2826,#1d2a24 80%)}

.door.locked{cursor:not-allowed}
.door.locked .n{color:rgba(239,233,220,.32)}
.door.d24.locked .n{color:rgba(236,217,166,.5)}
.door.ready{border-color:var(--gold)}
.door.ready .n{color:var(--gold-hi)}
.door.ready .s{color:var(--gold)}
.door.ready::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(236,217,166,.13) 50%,transparent 62%);background-size:260% 100%;animation:sheen 4s linear infinite}
.door.ready:hover{transform:translateY(-2px);background:linear-gradient(170deg,#214037,var(--pine) 75%)}
.door.d24.ready{box-shadow:0 0 28px -6px rgba(236,217,166,.7)}
.door.opened{background:linear-gradient(170deg,#1f3a32,#162c26 80%);border-color:rgba(201,169,104,.5)}
.door.opened .n{color:var(--gold)}
.door.opened .s{font-family:var(--f-display);font-style:italic;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)}
.door.opened .dot{position:absolute;top:10px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.door.opened.t-givre .dot{background:var(--frost)}
.door.opened.d24{background:linear-gradient(160deg,#3a3320,#1d2a22 80%)}
.door.shake{animation:nope .35s}
@keyframes sheen{from{background-position:150% 0}to{background-position:-100% 0}}
@keyframes nope{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}

footer{margin-top:28px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.snowbank{position:relative;z-index:1;margin-inline:-16px;margin-top:40px;height:90px;pointer-events:none}
.snowbank svg{display:block;width:100%;height:100%}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;transition:.3s;z-index:40;
  background:var(--pine-hi);border:1px solid var(--line);padding:10px 16px;border-radius:2px;font-size:14px;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Ouverture ---------- */
#ov{position:fixed;inset:0;z-index:30;background:radial-gradient(80% 60% at 50% 45%,#10221d,#040908 78%);overflow-y:auto;overflow-x:hidden;
  display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));transition:background 1s}
#ov{--c1:var(--gold);--c2:var(--gold-hi)}
#ov.t-givre{--c1:#6f98aa;--c2:#dcedf3}
#ov.t-icone{--c1:#e2c47a;--c2:#fff6d8}
#ov.t-fete{--c1:#d9917f;--c2:#fbe4dc}
#ov.t-fete .pack{background:linear-gradient(155deg,#fff1ea,#e8b2a2 45%,#7a3b33 140%)}
#ov.t-fete .pack .rv,#ov.t-fete .pack .rh{background:#c9a968}
.note.t-fete{--foil:#b9705f}
.note.t-fete .seal{background:radial-gradient(circle at 35% 30%,#f6d7cc,#d5917f 60%,#7d3f35);color:#3b1712;font-size:14px}
#ov.deep{background:radial-gradient(70% 55% at 50% 42%,#1c1a0e,#020403 80%)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0}
.beams{position:fixed;left:50%;top:45%;width:240vmax;height:240vmax;translate:-50% -50%;opacity:0;transition:opacity .8s;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c2) 16%,transparent) 0 5deg,transparent 5deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);animation:spin 30s linear infinite}
#ov.t-icone .beams{background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c2) 22%,transparent) 0 3deg,transparent 3deg 10deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 50%);mask:radial-gradient(circle,#000 0,transparent 50%);animation-duration:18s}
#ov.rays .beams{opacity:1}
#ov.calm .beams{opacity:.35}
.halo{position:fixed;left:50%;top:45%;width:70vmin;height:70vmin;translate:-50% -50%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--c2) 38%,transparent),transparent 65%);opacity:0;transition:opacity .6s}
#ov.t-icone .halo{width:110vmin;height:110vmin}
#ov.rays .halo{opacity:.85}
#ov.calm .halo{opacity:.4}
@keyframes spin{to{rotate:360deg}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:.9}100%{opacity:0}}

.stage{position:relative;z-index:1;display:grid;justify-items:center;gap:24px;width:100%;max-width:480px}
.slot{position:relative;width:240px;height:340px;max-width:100%;display:grid;place-items:center}

.pack{position:absolute;inset:0;border-radius:6px;overflow:hidden;cursor:pointer;
  background:linear-gradient(155deg,var(--c2),var(--c1) 45%,#3a2c10 140%);
  box-shadow:0 30px 60px -20px #000,0 0 0 1px rgba(255,255,255,.25) inset;display:grid;place-items:center;text-align:center;color:#1b1608;
  animation:float 3s ease-in-out infinite}
#ov.t-givre .pack{background:linear-gradient(155deg,#f4fbff,#8db8cb 50%,#20475a 140%)}
#ov.t-icone .pack{background:linear-gradient(155deg,#fffbea,#e9cf8a 35%,#b48a36 70%,#5a4012 130%);box-shadow:0 0 60px -10px rgba(236,217,166,.6),0 30px 60px -20px #000,0 0 0 1px rgba(255,255,255,.4) inset}
.pack::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 48%,transparent 62%);background-size:260% 100%;animation:sheen 2.6s linear infinite}
.pack .rv,.pack .rh{position:absolute;background:var(--berry);box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.pack .rh{left:0;right:0;top:calc(50% - 16px);height:32px}
.pack .rv{top:0;bottom:0;left:calc(50% - 16px);width:32px}
.pack .lbl{position:relative;z-index:1;display:grid;gap:2px;background:var(--paper);color:var(--paper-ink);padding:14px 22px 12px;border-radius:2px;box-shadow:0 6px 18px -8px rgba(0,0,0,.6)}
.pack .lbl small{font-weight:400;letter-spacing:.28em;text-transform:uppercase;font-size:10px}
.pack .lbl strong{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:54px;line-height:1}
@keyframes float{50%{transform:translateY(-8px)}}
.pack.shake{animation:packshake .9s ease-in}
.pack.shake-long{animation:packshake-long 2s ease-in}
@keyframes packshake{
  0%{transform:none}10%{transform:rotate(-3deg)}20%{transform:rotate(3deg)}30%{transform:rotate(-4deg) scale(1.02)}
  45%{transform:rotate(5deg) scale(1.04)}60%{transform:rotate(-6deg) scale(1.06)}75%{transform:rotate(6deg) scale(1.08)}100%{transform:scale(1.12)}}
@keyframes packshake-long{
  0%{transform:none}8%{transform:rotate(-2deg)}16%{transform:rotate(2deg)}24%{transform:none}38%{transform:none}
  44%{transform:rotate(-4deg) scale(1.03)}50%{transform:rotate(4deg) scale(1.05)}56%{transform:rotate(-5deg) scale(1.07)}
  62%{transform:rotate(6deg) scale(1.09)}68%{transform:rotate(-7deg) scale(1.11)}74%{transform:rotate(7deg) scale(1.13)}
  80%{transform:rotate(-8deg) scale(1.15)}86%{transform:rotate(8deg) scale(1.17)}92%{transform:rotate(-4deg) scale(1.2)}100%{transform:scale(1.24)}}
.pack.burst{animation:burst .5s ease-out forwards}
@keyframes burst{to{transform:scale(1.6);opacity:0;filter:brightness(3)}}

.reveal{position:absolute;inset:-40px;display:grid;place-content:center;text-align:center;gap:8px;pointer-events:none}
.reveal .lab{font-weight:400;letter-spacing:.34em;text-transform:uppercase;font-size:11px;color:var(--c2);opacity:.85}
.reveal .val{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:44px;line-height:1.05;color:#fff;text-shadow:0 0 28px var(--c1)}
#ov.t-icone .reveal .val{font-size:clamp(42px,11vw,60px)}
.reveal.in{animation:revin 1s cubic-bezier(.2,.9,.2,1) both}
#ov.t-icone .reveal.in{animation:revin 1.5s cubic-bezier(.2,.9,.2,1) both}
@keyframes revin{0%{opacity:0;transform:scale(1.5);filter:blur(8px)}35%{opacity:1;transform:scale(1);filter:none}80%{opacity:1}100%{opacity:0;transform:scale(.94)}}

/* ---------- Carte ---------- */
.note{position:relative;width:min(370px,100%);background:var(--paper);color:var(--paper-ink);
  padding:38px 34px 34px;border-radius:2px;box-shadow:0 40px 80px -30px #000,0 0 0 1px rgba(0,0,0,.05);
  --foil:#b08d47;text-align:center}
.note.t-givre{--foil:#7f9fae}
.note::before,.note::after{content:"";position:absolute;pointer-events:none;border:1px solid var(--foil)}
.note::before{inset:10px}
.note::after{inset:14px;opacity:.4}
.note .meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--foil);font-weight:500}
.note .sprig{width:64px;height:40px;margin:22px auto 10px;display:block;color:var(--foil)}
.note h2{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:30px;line-height:1.1;margin:0 0 14px;text-wrap:balance;letter-spacing:-.005em}
.note .rule{width:36px;height:1px;background:var(--foil);margin:0 auto 16px}
.note .body{display:grid;gap:12px}
.note p{margin:0 auto;font-size:15.5px;line-height:1.65;max-width:31ch;font-weight:400;color:#33423b}
.encart{margin:22px auto 0;max-width:290px;display:flex;align-items:center;gap:14px;text-align:left;padding:10px;border:1px solid color-mix(in srgb,var(--foil) 55%,transparent);border-radius:2px}
.encart .sq{flex:none;width:84px;height:84px;display:grid;place-items:center;background:#fff;padding:5px;border-radius:2px;color:var(--foil)}
.encart .sq.qr > *{width:100%!important;height:auto!important;display:block}
.encart .sq.empty{background:transparent;border:1px dashed var(--foil);font-size:11px;letter-spacing:.2em;padding:0}
.encart.paquet .sq{background:transparent;border:1px solid color-mix(in srgb,var(--foil) 40%,transparent)}
.encart.paquet .sq svg{width:40px;height:40px}
.encart .txt{display:grid;gap:3px;min-width:0}
.encart .k{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--foil);font-weight:500}
.encart .v{font-family:var(--f-display);font-style:italic;font-size:17px;line-height:1.2}
.encart .go{justify-self:start;margin-top:4px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:inherit;text-decoration:none;border-bottom:1px solid var(--foil);padding-bottom:2px;font-weight:500}
.encart .go:hover{color:var(--foil)}
.encart .go:focus-visible{outline:1px solid var(--foil);outline-offset:3px}
.note .sig{margin-top:22px;font-family:var(--f-display);font-style:italic;font-size:17px;color:var(--foil)}
.seal{position:absolute;right:22px;bottom:-22px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;z-index:2;
  background:radial-gradient(circle at 35% 30%,#a8404c,var(--berry) 60%,#4f121b);box-shadow:0 6px 14px -4px rgba(0,0,0,.6),inset 0 0 0 4px rgba(0,0,0,.12);
  font-family:var(--f-display);font-style:italic;font-size:15px;color:rgba(255,236,220,.9)}
.note.t-givre .seal{background:radial-gradient(circle at 35% 30%,#e9f4f8,#97b9c7 60%,#4a6e7d);color:#21414d}
.note.in{animation:notein .9s cubic-bezier(.2,.85,.25,1) both}
@keyframes notein{0%{opacity:0;transform:translateY(40px) rotateX(35deg) scale(.92)}100%{opacity:1;transform:none}}

/* la lettre du 24 : inversée, vert profond et or */
.note.t-icone{width:min(460px,100%);background:linear-gradient(170deg,#1b362e,var(--pine-deep));color:var(--ink);--foil:#d9bc78;
  padding:48px 40px 44px;box-shadow:0 0 90px -20px rgba(236,217,166,.45),0 40px 80px -30px #000}
.note.t-icone::before{inset:12px}
.note.t-icone::after{inset:17px;opacity:.5}
.note.t-icone .corner{position:absolute;width:26px;height:26px;color:var(--foil)}
.note.t-icone .corner.tl{top:22px;left:22px}.note.t-icone .corner.tr{top:22px;right:22px;transform:scaleX(-1)}
.note.t-icone .corner.bl{bottom:22px;left:22px;transform:scaleY(-1)}.note.t-icone .corner.br{bottom:22px;right:22px;transform:scale(-1)}
.note.t-icone .bigstar{width:46px;height:46px;margin:22px auto 14px;display:block;color:var(--foil);filter:drop-shadow(0 0 10px rgba(236,217,166,.6))}
.note.t-icone h2{font-size:clamp(34px,8vw,44px);color:var(--gold-hi)}
.note.t-icone p{color:#ddd6c6;max-width:34ch;font-size:16px}
.note.t-icone .sig{font-size:22px;color:var(--gold-hi)}
.note.t-icone.in{animation:letterin 1.4s cubic-bezier(.2,.85,.25,1) both}
@keyframes letterin{0%{opacity:0;transform:translateY(80px) scale(.7)}60%{opacity:1}100%{opacity:1;transform:none}}

/* ---------- Enveloppe du 24 ---------- */
.envelope{position:relative;width:min(340px,86vw);aspect-ratio:1.55;perspective:900px}
.envelope.in{animation:envin 1s cubic-bezier(.2,.85,.25,1) both}
@keyframes envin{0%{opacity:0;transform:translateY(60px) scale(.8) rotate(-4deg)}100%{opacity:1;transform:none}}
.envelope .back{position:absolute;inset:0;background:#132a23;border:1px solid rgba(217,188,120,.6);border-radius:3px;box-shadow:0 40px 80px -30px #000,0 0 70px -20px rgba(236,217,166,.4)}
.envelope .letter{position:absolute;left:8%;right:8%;top:8%;bottom:8%;background:var(--paper);border-radius:2px;z-index:1;transition:transform 1s cubic-bezier(.3,.8,.3,1) .5s;
  display:grid;place-items:start center;padding-top:14%;font-family:var(--f-display);font-style:italic;color:var(--paper-ink);font-size:20px}
.envelope .pocket{position:absolute;inset:0;z-index:2;background:linear-gradient(170deg,#1a352d,#10241e);border-radius:3px;
  clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.envelope .pocket::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.6%,rgba(217,188,120,.45) 50%,transparent 50.4%),linear-gradient(to top left,transparent 49.6%,rgba(217,188,120,.45) 50%,transparent 50.4%)}
.envelope .flap{position:absolute;left:0;right:0;top:0;height:62%;z-index:3;transform-origin:top;transition:transform .8s ease-in-out,z-index 0s .4s;
  background:linear-gradient(180deg,#21423a,#173029);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.envelope .addr{position:absolute;left:0;right:0;bottom:12%;z-index:3;text-align:center;font-family:var(--f-display);font-style:italic;font-size:24px;color:var(--gold-hi);pointer-events:none}
.envelope .wax{position:absolute;left:50%;top:62%;translate:-50% -50%;z-index:4;width:72px;height:72px;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#b54654,var(--berry) 58%,#4a0f18);box-shadow:0 8px 18px -6px #000,inset 0 0 0 5px rgba(0,0,0,.14),0 0 0 0 rgba(236,217,166,.5);
  font-family:var(--f-display);font-style:italic;font-size:30px;color:rgba(255,232,214,.92);transition:transform .5s,opacity .5s;animation:waxpulse 2s ease-in-out infinite}
.envelope .wax:focus-visible{outline:1px solid var(--gold-hi);outline-offset:4px}
@keyframes waxpulse{50%{box-shadow:0 8px 18px -6px #000,inset 0 0 0 5px rgba(0,0,0,.14),0 0 0 12px rgba(236,217,166,0),0 0 30px 4px rgba(236,217,166,.35)}}
.envelope .hint{position:absolute;left:0;right:0;top:calc(100% + 18px);text-align:center;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);transition:opacity .4s}
.envelope.open .wax{transform:scale(1.4) rotate(20deg);opacity:0;animation:none}
.envelope.open .hint,.envelope.open .addr{opacity:0}
.envelope.open .flap{transform:rotateX(180deg);z-index:0}
.envelope.open .letter{transform:translateY(-62%)}
.envelope.out{animation:envout .7s ease-in forwards}
@keyframes envout{to{opacity:0;transform:translateY(40px) scale(.9)}}

.btn{font-family:var(--f-body);font-weight:400;font-size:12px;letter-spacing:.3em;text-transform:uppercase;border-radius:2px;padding:14px 28px;cursor:pointer;
  background:transparent;color:var(--c2);border:1px solid var(--c1)}
.btn:hover{background:color-mix(in srgb,var(--c1) 18%,transparent)}
.btn.ghost{color:var(--ink);border-color:rgba(239,233,220,.3)}
.btn:focus-visible{outline:1px solid #fff;outline-offset:3px}
.actions{margin-top:14px;display:flex;justify-content:center}
.preview-badge{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:50;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;background:var(--berry);color:#fff;padding:5px 9px;border-radius:2px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>

  </div>
</div>

function encart(d){
  const j = JOURS[d-1];
  if (j.acces === "paquet"){
    return `<div class="encart paquet"><div class="sq">${GIFT}</div>

  if (j.acces === "lien"){
    if (!j.lien) return `<div class="encart"><div class="sq empty">QR</div>

  return "";

const CORNER = c => `<svg class="corner ${c}" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M1 25V8a7 7 0 0 1 7-7h17"/><path d="M5 25V10a5 5 0 0 1 5-5h15" opacity=".5"/><circle cx="9" cy="9" r="1.6" fill="currentColor"/></svg>`;
const SPRIG = '<svg class="sprig" viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><path d="M4 30c14-2 26-10 28-24M60 30C46 28 34 20 32 6"/><path d="M12 28c-1-6 2-11 8-13-1 6-3 10-8 13zM20 22c0-6 4-10 10-11-2 6-5 9-10 11zM52 28c1-6-2-11-8-13 1 6 3 10 8 13zM44 22c0-6-4-10-10-11 2 6 5 9 10 11z"/><circle cx="32" cy="30" r="2.6" fill="currentColor" stroke="none"/><circle cx="27.5" cy="33" r="2.2" fill="currentColor" stroke="none"/><circle cx="36.5" cy="33" r="2.2" fill="currentColor" stroke="none"/></svg>';
const ORDER = [7,14,2,21,10,18,1,23,5,12,16,3,20,9,24,6,13,19,11,4,22,8,15,17];
const PALETTE = {or:["#ecd9a6","#c9a968","#fff8e4"], givre:["#dcedf3","#a9c8d4","#ffffff"], fete:["#f3cfc3","#e2a493","#fff1ea","#ecd9a6"], icone:["#fff3c4","#e2c47a","#ffffff","#c9a968","#f7e1a0"]};

function renderStatus(){
  const now = new Date(), start = unlockDate(1), end = unlockDate(25);
  const el = document.getElementById("status");
  const n = opened.size;
  if (PREVIEW){ el.innerHTML = "Mode aperçu : toutes les cases sont ouvrables. Retire <b>#apercu</b> du lien avant de l'envoyer."; return; }
  if (now < start){
    const days = Math.ceil((start - now) / 864e5);
    el.innerHTML = `La première case s'ouvre le <b>1er décembre</b>, dans ${days} jour${days>1?"s":""}.`;
  } else if (now < end){
    const left = JOURS.filter((_,i)=>isUnlocked(i+1) && !opened.has(i+1)).length;
    el.innerHTML = `<b>${now.getDate()} décembre.</b> ${left ? `${left} case${left>1?"s":""} t'attend${left>1?"ent":""}.` : "Tout est ouvert pour aujourd'hui, à demain."} <span style="opacity:.7">${n}/24</span>`;
  } else el.innerHTML = `<b>Joyeux Noël.</b> ${n === 24 ? "Les vingt-quatre cartes sont à toi." : `Il reste ${24-n} case${24-n>1?"s":""} à ouvrir.`}`;
}

function render(){
  drawGarland();
  grid.innerHTML = ""; ticks.innerHTML = "";
  for (let d=1; d<=24; d++){
    const t = document.createElement("i");
    t.className = opened.has(d) ? "done" : isUnlocked(d) ? "ready" : "";
    ticks.appendChild(t);
  }
  ORDER.forEach(d => {
    const j = JOURS[d-1], b = document.createElement("button");
    const un = isUnlocked(d), op = opened.has(d);
    b.className = "door " + (op ? `opened t-${j.tier}` : un ? "ready" : "locked") + (d === 24 ? " d24" : "");
    b.dataset.d = d;
    const star = d === 24 ? STAR : j.tier === "fete" ? CANDLE : "";
    if (j.tier === "fete") b.classList.add("fete");
    b.innerHTML = op
      ? `${star || '<span class="dot"></span>'}<span class="n">${d}</span><span class="s"><span>${esc(j.nom)}</span></span>`
      : `${star}<span class="n">${d}</span><span class="s">${un ? "<span>Ouvrir</span>" : LOCK + "<span>" + d + " déc.</span>"}</span>`;
    b.setAttribute("aria-label", op ? `${d} décembre, ouvert : ${j.titre}` : un ? `${d} décembre, à ouvrir` : `${d} décembre, verrouillé`);
    if (!un) b.setAttribute("aria-disabled","true");
    grid.appendChild(b);
  });
  renderStatus();
}

let toastT;
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),2600); }

grid.addEventListener("click", e => {
  const b = e.target.closest(".door"); if(!b) return;
  const d = +b.dataset.d;
  if (!isUnlocked(d)){
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    const diff = Math.ceil((unlockDate(d) - new Date())/864e5);
    toast(d === 24 ? "Celle-ci, c'est la plus belle. Elle attend le 24." : diff === 1 ? "Patience, celle-ci s'ouvre demain." : `Patience, celle-ci s'ouvre le ${d} décembre.`);
    return;
  }
  openCase(d, opened.has(d));
});

/* ---------- Guirlande ---------- */
let litBefore = null;
function drawGarland(){
  const host = document.getElementById("garland"), w = host.clientWidth || 800, h = 70;
  const swags = w < 500 ? 2 : 3, seg = w / swags, per = 24 / swags, cols = ["#ecd9a6","#f0b9a5","#fff3d6","#a9c8d4","#e2c47a","#f4d58a"];
  const full = opened.size === 24;
  let path = "", bulbs = "", k = 0;
  for (let s=0; s<swags; s++){
    const x0 = s*seg, x1 = x0+seg, sag = 34;
    path += `M${x0} 6 Q${x0+seg/2} ${6+sag*2} ${x1} 6 `;
    for (let i=0; i<per; i++){
      const t = (i+.5)/per, x = (1-t)*(1-t)*x0 + 2*(1-t)*t*(x0+seg/2) + t*t*x1, y = (1-t)*(1-t)*6 + 2*(1-t)*t*(6+sag*2) + t*t*6 + 5;
      const day = k+1, lit = opened.has(day), fresh = lit && litBefore && !litBefore.has(day);
      const c = cols[k % cols.length], delay = ((k*0.37) % 3).toFixed(2), X = x.toFixed(1), Y = y.toFixed(1);
      bulbs += `<line x1="${X}" y1="${(y-5).toFixed(1)}" x2="${X}" y2="${(y-2.5).toFixed(1)}" class="wire"/>`;
      bulbs += lit
        ? `<g class="bulb lit${fresh?" fresh":""}" style="animation-delay:-${delay}s;transform-origin:${X}px ${Y}px"><circle cx="${X}" cy="${Y}" r="${full?10:8}" fill="${c}" opacity=".2"/><circle cx="${X}" cy="${Y}" r="3" fill="${c}"/></g>`
        : `<g class="bulb off"><circle cx="${X}" cy="${Y}" r="2.8" fill="rgba(239,233,220,.07)" stroke="rgba(239,233,220,.22)" stroke-width=".8"/></g>`;
      k++;
    }
  }
  host.classList.toggle("full", full);
  host.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path class="wire" d="${path}"/>${bulbs}</svg>`;
  litBefore = new Set(opened);
}

function drawDeco(){
  const host = document.getElementById("deco"), keys = Object.keys(SYMBOLS);
  const w = innerWidth, n = w < 640 ? 14 : 26, cols = ["#c9a968","#c9a968","#c9a968","#a3424e","#a9c8d4"];
  let seed = 7, rnd = () => (seed = (seed*9301 + 49297) % 233280) / 233280;
  let html = "";
  // grille jitterée : répartition régulière, pas d'amas
  const gc = w < 640 ? 3 : 6, gr = Math.ceil(n/gc);
  for (let i=0;i<n;i++){
    const cx = (i % gc + .15 + rnd()*.7) / gc * 100, cy = (Math.floor(i/gc) + .15 + rnd()*.7) / gr * 100;
    const k = keys[Math.floor(rnd()*keys.length)], s = 22 + rnd()*26, r = Math.round(rnd()*40-20);
    const op = (.09 + rnd()*.1).toFixed(2), c = cols[Math.floor(rnd()*cols.length)], dl = (rnd()*9).toFixed(1);
    html += `<svg viewBox="0 0 24 24" style="left:${cx.toFixed(1)}%;top:${cy.toFixed(1)}%;width:${s.toFixed(0)}px;height:${s.toFixed(0)}px;rotate:${r}deg;opacity:${op};color:${c};animation-delay:-${dl}s;--r2:${r>0?3:-3}deg">${SYMBOLS[k]}</svg>`;
  }
  host.innerHTML = html;
}

/* ---------- Ciel : étoiles + neige ----------
   La neige s'intensifie de jour en jour : légère avant décembre, tempête douce le 24. */
function snowLevel(){
  const now = new Date();
  let d = PREVIEW ? opened.size : now < unlockDate(1) ? 0 : now >= unlockDate(25) ? 24 : now.getDate();
  return .14 + .86 * Math.min(d,24) / 24;
}
(function(){
  const c = document.getElementById("sky"), x = c.getContext("2d"); let w,h,flakes=[],stars=[],dpr=1,tickN=0,level=snowLevel();
  function size(){
    dpr = Math.min(2, devicePixelRatio || 1);
    w = innerWidth; h = innerHeight; c.width = w*dpr; c.height = h*dpr; c.style.width = w+"px"; c.style.height = h+"px"; x.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.min(320, Math.round(w/3.6));
    flakes = Array.from({length:n},()=>{ const z = Math.random(); return {x:Math.random()*w,y:Math.random()*h,z,r:.5+z*2.6,s:.2+z*.9,o:Math.random()*6.3,a:.25+z*.6}; });
    stars = Array.from({length:Math.round(w/16)},()=>({x:Math.random()*w,y:Math.random()*h*.45,r:Math.random()*1.1+.2,p:Math.random()*6.3,sp:.01+Math.random()*.02}));
  }
  size(); addEventListener("resize", () => { size(); drawGarland(); });
  function frame(){
    x.clearRect(0,0,w,h);
    for (const s of stars){ s.p += s.sp; x.globalAlpha = .25 + .35*(.5+.5*Math.sin(s.p)); x.fillStyle = "#f4ead0"; x.beginPath(); x.arc(s.x,s.y,s.r,0,7); x.fill(); }
    if (++tickN % 120 === 1) level = snowLevel();
    const active = Math.round(flakes.length * level), speed = .85 + level*.35;
    for (let i=0; i<active; i++){ const f = flakes[i];
      f.y += f.s*speed; f.o += .006 + f.z*.006; f.x += Math.sin(f.o)*(.2+f.z*.4);
      if (f.y > h+5){ f.y = -5; f.x = Math.random()*w; }
      x.globalAlpha = f.a; x.fillStyle = "#f3f1ea"; x.beginPath(); x.arc(f.x,f.y,f.r,0,7); x.fill();
    }
    x.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(frame);
  }
  frame();
})();

/* ---------- Effets de l'ouverture (paillettes) ---------- */
const FX = (function(){
  const c = document.getElementById("fx"), x = c.getContext("2d"); let w,h,parts=[],run=false,glitter=0,pal=PALETTE.or;
  function size(){ const dpr = Math.min(2, devicePixelRatio||1); w=innerWidth; h=innerHeight; c.width=w*dpr; c.height=h*dpr; c.style.width=w+"px"; c.style.height=h+"px"; x.setTransform(dpr,0,0,dpr,0,0); }
  addEventListener("resize", size); size();
  const pick = () => pal[Math.floor(Math.random()*pal.length)];
  function burst(n, power=1){
    if (reduce) return;
    const cx = w/2, cy = h*0.45;
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, v = (2+Math.random()*7)*power;
      parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,g:.09,dr:.985,life:0,max:70+Math.random()*70,r:1+Math.random()*2.6,c:pick(),rot:Math.random()*6,vr:(Math.random()-.5)*.3,sh:Math.random()<.5});
    }
    start();
  }
  function spawnGlitter(){
    for (let i=0;i<glitter;i++) if (Math.random()<.6)
      parts.push({x:Math.random()*w,y:-8,vx:(Math.random()-.5)*.6,vy:.6+Math.random()*1.4,g:.004,dr:1,life:0,max:h/1.2,r:.8+Math.random()*2.2,c:pick(),rot:Math.random()*6,vr:(Math.random()-.5)*.08,sh:Math.random()<.6,sway:Math.random()*6});
  }
  function start(){ if (!run && !reduce){ run = true; requestAnimationFrame(tick); } }
  function tick(){
    x.clearRect(0,0,w,h);
    spawnGlitter();
    parts = parts.filter(p => p.life < p.max && p.y < h+20);
    for (const p of parts){
      p.life++; p.vx *= p.dr; p.vy = p.vy*p.dr + p.g; p.x += p.vx + (p.sway!==undefined ? Math.sin((p.sway+=.03))*.4 : 0); p.y += p.vy; p.rot += p.vr;
      const fade = 1 - p.life/p.max, tw = .6 + .4*Math.sin(p.life*.3 + p.r*3);
      x.globalAlpha = Math.max(0, Math.min(1, fade*1.4)) * tw; x.fillStyle = p.c;
      x.save(); x.translate(p.x,p.y); x.rotate(p.rot);
      if (p.sh){ x.beginPath(); x.moveTo(0,-p.r*1.8); x.lineTo(p.r*.7,0); x.lineTo(0,p.r*1.8); x.lineTo(-p.r*.7,0); x.closePath(); x.fill(); }
      else { x.beginPath(); x.arc(0,0,p.r*.8,0,7); x.fill(); }
      x.restore();
    }
    x.globalAlpha = 1;
    if (parts.length || glitter) requestAnimationFrame(tick); else run = false;
  }
  return {
    palette(t){ pal = PALETTE[t] || PALETTE.or; },
    burst, glitter(n){ glitter = n; if (n) start(); },
    clear(){ parts = []; glitter = 0; x.clearRect(0,0,w,h); }
  };
})();

/* ---------- Ouverture ---------- */
const ov=document.getElementById("ov"), slot=document.getElementById("slot"), pack=document.getElementById("pack"),
      reveal=document.getElementById("reveal"), note=document.getElementById("note"), env=document.getElementById("env"), wax=document.getElementById("wax"),
      openBtn=document.getElementById("openBtn"), closeBtn=document.getElementById("closeBtn"), flash=document.getElementById("flash");
let cur=null, timers=[], lastFocus=null, running=false, waxResolve=null;
const wait = ms => new Promise(r => timers.push(setTimeout(r, reduce ? 10 : ms)));
const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
const doFlash = () => restart(flash, "go");

function buildNote(d){
  const j = JOURS[d-1];
  note.className = `note t-${j.tier}`;
  if (j.tier === "icone"){
    note.innerHTML = `${CORNER("tl")}${CORNER("tr")}${CORNER("bl")}${CORNER("br")}
      <div class="meta"><span>24 décembre</span><span>${CONFIG.annee}</span></div>
      ${BIGSTAR}
      <h2>${esc(j.titre)}</h2>
      <div class="rule"></div>
      <div class="body">${paras(j.texte)}</div>
      ${encart(d)}
      ${CONFIG.signatureLettre ? `<div class="sig">${esc(CONFIG.signatureLettre)}</div>` : ""}`;
    return;
  }
  if (j.tier === "fete"){
    note.innerHTML = `
      <div class="meta"><span>${d} décembre</span><span>${CATS[j.cat]}</span></div>
      ${CAKE}
      <h2>${esc(j.titre)}</h2>
      <div class="rule"></div>
      <div class="body">${paras(j.texte)}</div>
      ${encart(d)}
      ${CONFIG.signature ? `<div class="sig">${esc(CONFIG.signature)}</div>` : ""}
      <div class="seal" aria-hidden="true">${esc(j.sceau || j.fete[0])}</div>`;
    return;
  }
  note.innerHTML = `
    <div class="meta"><span>${d} décembre</span><span>${CATS[j.cat]}</span></div>
    ${SPRIG}
    <h2>${esc(j.titre)}</h2>
    <div class="rule"></div>
    <div class="body">${paras(j.texte)}</div>
      ${encart(d)}
    ${CONFIG.signature ? `<div class="sig">${esc(CONFIG.signature)}</div>` : ""}
    ${j.tier === "givre" ? `<div class="seal" aria-hidden="true">${ROMAN(d)}</div>` : ""}`;
}

function openCase(d, already){
  cur = d; lastFocus = document.activeElement; running = false;
  const j = JOURS[d-1];
  ov.className = `t-${j.tier}`; ov.hidden = false; ov.scrollTop = 0; document.body.style.overflow = "hidden";
  FX.clear(); FX.palette(j.tier);
  buildNote(d); fillQR();
  document.getElementById("packN").textContent = d;
  reveal.hidden = true; closeBtn.hidden = true; env.hidden = true; env.className = "envelope"; note.classList.remove("in");
  if (already){
    slot.hidden = true; openBtn.hidden = true; ov.classList.add("calm");
    if (j.tier === "icone"){ ov.classList.add("deep"); FX.glitter(2); }
    note.hidden = false; note.classList.add("in");
    closeBtn.hidden = false; closeBtn.focus();
  } else {
    slot.hidden = false; pack.hidden = false; pack.className = "pack"; note.hidden = true;
    openBtn.hidden = false; openBtn.textContent = d === 24 ? "Ouvrir la dernière case" : "Ouvrir"; openBtn.focus();
  }
}

async function showSteps(steps, ms, burstEach){
  for (const [lab,val] of steps){
    reveal.innerHTML = `<div class="lab">${esc(lab)}</div><div class="val">${esc(val)}</div>`;
    reveal.hidden = false; restart(reveal, "in");
    if (burstEach) FX.burst(burstEach, .8);
    await wait(ms);
  }
  reveal.hidden = true;
}

async function runOpening(){
  if (running) return; running = true;
  const d = cur, j = JOURS[d-1];
  openBtn.hidden = true;
  if (j.tier === "icone") return runChristmas();
  const walkout = j.tier !== "or", fete = j.tier === "fete";
  pack.classList.add("shake");
  await wait(900);
  pack.classList.remove("shake"); pack.classList.add("burst");
  doFlash(); FX.burst(walkout ? 140 : 80); ov.classList.add("rays");
  if (walkout) FX.glitter(fete ? 2 : 1);
  await wait(500);
  pack.hidden = true;
  const steps = fete
    ? [["Aujourd'hui", "on fête"], ["L'anniversaire de", j.fete]]
    : walkout
      ? [["Une case", "givrée"], ["Le", `${d} décembre`], ["Aujourd'hui", j.quoi]]
      : [["Aujourd'hui", j.quoi]];
  await showSteps(steps, walkout ? 1300 : 1050, fete ? 40 : 0);
  slot.hidden = true;
  ov.classList.remove("rays"); ov.classList.add("calm");
  note.hidden = false; restart(note, "in");
  await wait(600);
  FX.glitter(0);
  finish(d);
}

async function runChristmas(){
  const d = 24, name = CONFIG.prenom || "toi";
  ov.classList.add("deep");
  FX.glitter(1);
  pack.classList.add("shake-long");
  await wait(2000);
  pack.classList.remove("shake-long"); pack.classList.add("burst");
  doFlash(); FX.burst(260, 1.3); ov.classList.add("rays");
  await wait(250); FX.burst(120, .9);
  await wait(450);
  pack.hidden = true;
  FX.glitter(3);
  await showSteps([["Nous y sommes", "24 décembre"], ["Voici", "la dernière case"], ["Pour", name]], 1500, 50);
  slot.hidden = true;
  env.hidden = false; restart(env, "in");
  await wait(900);
  wax.focus();
  await new Promise(r => { waxResolve = r; });
  waxResolve = null;
  FX.burst(90, .7);
  env.classList.add("open");
  await wait(1700);
  env.classList.add("out");
  await wait(650);
  env.hidden = true;
  doFlash(); FX.burst(220, 1.2);
  ov.classList.remove("rays"); ov.classList.add("calm");
  note.hidden = false; restart(note, "in");
  FX.glitter(2);
  await wait(1200);
  finish(d);
}

function finish(d){
  closeBtn.hidden = false; closeBtn.focus();
  opened.add(d); save(); running = false;
}

wax.addEventListener("click", () => { if (waxResolve) waxResolve(); });

function closeOv(){
  timers.forEach(clearTimeout); timers=[]; running = false; waxResolve = null;
  FX.clear();
  ov.hidden = true; ov.className = ""; document.body.style.overflow = "";
  render();
  const b = grid.querySelector(`[data-d="${cur}"]`); (b || lastFocus)?.focus();
}
openBtn.addEventListener("click", runOpening);
pack.addEventListener("click", runOpening);
closeBtn.addEventListener("click", closeOv);
document.addEventListener("keydown", e => { if (e.key==="Escape" && !ov.hidden && !closeBtn.hidden) closeOv(); });

/* ---------- Écran d'attente ---------- */
const FORCE_WAIT = location.hash === "#attente";
const waitEl = document.getElementById("wait"), calEl = document.getElementById("cal");
let waitTimer = null;
function isWaiting(){ return FORCE_WAIT || (!PREVIEW && new Date() < unlockDate(1)); }
function setupWait(){
  document.getElementById("wName").textContent = CONFIG.prenom || "toi";
  document.getElementById("wLead").textContent = CONFIG.messageAttente;
  document.getElementById("wDoors").innerHTML = Array.from({length:24},(_,i)=>`<i>${i+1}</i>`).join("");
  waitEl.hidden = false; calEl.hidden = true;
  const ids = ["cD","cH","cM","cS"].map(id => document.getElementById(id));
  const upd = () => {
    let ms = unlockDate(1) - new Date();
    if (ms <= 0 && !FORCE_WAIT){ clearInterval(waitTimer); waitEl.hidden = true; calEl.hidden = false; render(); FX_bootBurst(); return; }
    ms = Math.max(0, ms);
    const v = [Math.floor(ms/864e5), Math.floor(ms/36e5)%24, Math.floor(ms/6e4)%60, Math.floor(ms/1e3)%60].map(n => String(n).padStart(2,"0"));
    ids.forEach((el,i) => { if (el.textContent !== v[i]){ el.textContent = v[i]; if (!reduce) restart(el, "tick"); } });
  };
  upd(); waitTimer = setInterval(upd, 1000);
}
function FX_bootBurst(){ toast("C'est parti : la première case est ouverte."); }

/* ---------- Easter egg : la boule dorée ---------- */
document.getElementById("baubles").addEventListener("click", e => {
  const ball = e.target.closest(".ball"); if (!ball) return;
  restart(ball, "wiggle");
  if (ball.dataset.egg && ov.hidden) timers.push(setTimeout(openEgg, reduce ? 10 : 650));
});
function openEgg(){
  const sec = CONFIG.secret; if (!sec) return;
  cur = null; lastFocus = document.activeElement; running = false;
  ov.className = "t-icone deep calm"; ov.hidden = false; ov.scrollTop = 0; document.body.style.overflow = "hidden";
  FX.clear(); FX.palette("icone");
  slot.hidden = true; env.hidden = true; reveal.hidden = true; openBtn.hidden = true;
  note.className = "note t-or";
  note.innerHTML = `<div class="meta"><span>Case secrète</span><span>N° 25</span></div>${SPRIG}
    <h2>${esc(sec.titre)}</h2><div class="rule"></div><div class="body">${paras(sec.texte)}</div>
    ${CONFIG.signature ? `<div class="sig">${esc(CONFIG.signature)}</div>` : ""}
    <div class="seal" aria-hidden="true">♥</div>`;
  note.hidden = false; restart(note, "in");
  doFlash(); FX.burst(160); FX.glitter(1);
  closeBtn.hidden = false; closeBtn.focus();
}

render();
if (isWaiting()) setupWait();
setInterval(() => { if (ov.hidden && !isWaiting()) render(); }, 60000);
</script>
